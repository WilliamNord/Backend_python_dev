{% extends "base.html" %}

{% block tittel %}Secrets{% endblock %}

{% block innhold %}

<h1>Legg til hemmelighet</h1>

<form action="/add" method="POST">
    <input type="text" name="secret" required>
    <button type="submit">Lagre</button>
</form>

<h2>Lagrede verdier:</h2>

<ul>
    {% for row in rows %}
        <li>{{ row[1] }} ({{ row[2] }})</li>
    {% endfor %}
</ul>

{% endblock %}
